<p><em><strong>Se déplacer entre les attaques.</strong></em> Si vous vous déplacez pendant votre tour et disposez d'une aptitude telle qu'<strong>Attaque supplémentaire</strong>, qui vous octroie plusieurs attaques dans le cadre de l'action <strong>Attaque</strong>, vous pouvez consacrer tout ou partie de ce déplacement à vous mouvoir entre ces attaques.</p>
